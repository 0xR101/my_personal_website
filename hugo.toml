baseURL = "https://0xr101.github.io/"
locale = "en-us"
title = "Rayyan Raza"
theme = "ink"
[params]
  author = "Rayyan Raza"
  description = "Physicist and Software Engineer"
  homeTitle = "I'm Rayyan Raza"
  homeSubtitle = "Physics Researcher"
  homeBio = "I am a first year physics PhD student specialized in theoretical condensed matter physics, quantum computing and error correction. I have lots of hobbies beside research."
  homeImage = "/images/profile/personal_photo.jpg"    # Avatar on homepage (place in static/images/, renders as 110px circle)
  # Icon links are emitted by layouts/_default/baseof.html rather than through
  # the theme's own favicon param, which writes the href verbatim. Harmless now
  # that the site is served from the domain root, but it keeps the site correct
  # if it ever moves back under a subpath.
  recentPostsCount = 3               # Posts shown on homepage (default: 3)             # Posts shown on homepage (default: 3)
  math = true

  # Social links — displayed in the homepage hero section
  [[params.socialLinks]]
    name = "GitHub"
    url = "https://github.com/0xR101" # Dynamically updated based on your baseURL
    external = true                   # Opens in new tab with external link indicator
  
  [[params.socialLinks]]
    name = "LinkedIn"
    url = "https://linkedin.com/in/rayyan-raza" # Update with your exact LinkedIn vanity URL
    external = true
  
  [[params.socialLinks]]
    name = "Email"
    url = "mailto:contact@rayyanraza.com" # Recommended: Use a custom domain email or a professional primary address
  
  
  [[params.socialLinks]]
    name = "X"
    url = "https://x.com/1rayyanreda"
    external = true


# Navigation menu
[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Papers & Research"
    url = "/research/"
    weight = 3

  [[menu.main]]
    name = "Books"
    url = "/books/"
    weight = 4

  [[menu.main]]
    name = "Experience"
    url = "/experience/"
    weight = 5

  [[menu.main]]
    name = "Achievements"
    url = "/achievements/"
    weight = 6

  [[menu.main]]
    name = "Life"
    url = "/life/"
    weight = 7

# Output formats — enables llms.txt generation and JSON for site search
[outputs]
  home = ["HTML", "RSS", "llmstxt", "JSON"]

[outputFormats.llmstxt]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Related posts — powers the "Related Posts" section on blog entries
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  
  [[related.indices]]
    name = "tags"
    weight = 100
  
  [[related.indices]]
    name = "date"
    weight = 10
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
# Dates fall back to the file's modification time, so a gallery entry whose
# index.md has no front matter at all still sorts correctly.
[frontmatter]
  date = ["date", "publishDate", "lastmod", ":fileModTime", ":default"]

# Thumbnail/resize quality for gallery image processing
[imaging]
  quality = 82
  resampleFilter = "Lanczos"
